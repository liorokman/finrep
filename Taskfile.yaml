version: '3'

tasks:
  default:
    deps: [build]

  build-ui:
    desc: Build frontend Vite + Tailwind UI assets
    dir: web
    cmds:
      - npm install
      - npm run build

  build:
    desc: Build single-binary Go executable
    deps: [build-ui]
    cmds:
      - go build -o finrep ./cmd/server

  build-ccpdf2csv:
    desc: Build secondary PDF to CSV converter CLI utility
    cmds:
      - go build -o ccpdf2csv ./cmd/ccpdf2csv

  dev:
    desc: Run server in dev mode with debug logging and OIDC bypass
    cmds:
      - go run ./cmd/server --log-level=debug --oidc-enabled=false --port=8080

  build-finrep:
    desc: Build the v2 server binary (rewrite branch)
    cmds:
      - go build -o finrep ./cmd/finrep

  dev-finrep:
    desc: Run the v2 server locally (auth off, loopback only)
    cmds:
      - go run ./cmd/finrep --auth=off --log-level=debug --port=8080

  lint:
    desc: Format check and vet
    cmds:
      # Only the v2 packages are checked; the legacy code is deleted as it is replaced.
      - test -z "$(gofmt -l cmd/finrep internal/money internal/store internal/conf internal/ledger internal/importer internal/llm internal/categorize internal/billing internal/reports internal/settings internal/authn internal/api internal/jsonx internal/mcpsrv)"
      - go vet ./...

  run-mcp:
    desc: Run in MCP stdio transport mode
    cmds:
      - go run ./cmd/server --mode=mcp

  test:
    desc: Run all Go unit and integration tests
    cmds:
      - go test -v ./...

  docker-build:
    desc: Build multi-stage Docker container image
    cmds:
      - docker build -t finrep:latest .

  docker-up:
    desc: Start Docker container environment
    cmds:
      - docker-compose up -d

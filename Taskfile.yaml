version: '3'

tasks:
  default:
    deps: [build]

  build:
    desc: Build the single binary (the UI is embedded)
    cmds:
      - go build -o finrep ./cmd/finrep

  dev:
    desc: Run locally with login off (loopback only); open /?mock=1 for sample data
    cmds:
      - go run ./cmd/finrep --auth=off --log-level=debug --port=8080

  run-mcp:
    desc: Run the MCP server on stdio
    cmds:
      - go run ./cmd/finrep --mode=mcp

  lint:
    desc: Format check, vet, and a syntax check of every UI module
    cmds:
      - test -z "$(gofmt -l cmd internal)"
      - go vet ./...
      - task: lint-ui

  lint-ui:
    desc: Syntax-check the browser modules as ES modules (node --check on .js files is lenient)
    dir: internal/webui/static
    cmds:
      - |
        fail=0
        for f in $(find js -name '*.js'); do
          tmp=$(mktemp --suffix=.mjs); cp "$f" "$tmp"
          node --check "$tmp" >/dev/null 2>&1 || { echo "syntax error in $f"; node --check "$tmp" 2>&1 | head -3; fail=1; }
          rm -f "$tmp"
        done
        exit $fail

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test-ui:
    desc: Browser smoke test (needs Google Chrome); starts a throwaway server
    cmds:
      - |
        go build -o /tmp/finrep-uitest ./cmd/finrep
        /tmp/finrep-uitest --auth=off --port=18091 --db-path=$(mktemp -d)/f.db >/dev/null 2>&1 &
        pid=$!; sleep 1
        node internal/webui/uitest/smoke.mjs http://127.0.0.1:18091; rc=$?
        kill $pid; exit $rc

  test-race:
    desc: Run all Go tests with the race detector
    cmds:
      - go test -race ./...

  docker-build:
    desc: Build the container image
    cmds:
      - docker build -t finrep:latest .
